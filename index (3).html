<style>
:root{--navy:#14213d;--orange:#FB8102;--bg:#f3f6fb;--ink:#14213d;--mute:#5b6784;--line:#d8dfec;--card:#fff;
--g:#2e9e57;--y:#e0a21f;--r:#d6453d;--w:#9aa3b5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:1px}.brand span{color:var(--orange)}
header h1{font-size:15px;font-weight:600;color:#c9d3ea;flex:1}
.bar{height:4px;background:linear-gradient(90deg,#FB8102,#f2b84b,#2f6fbf)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
button.pri{background:var(--orange);border-color:var(--orange);color:var(--navy);font-weight:700}
button.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
button.ghost{background:transparent;color:#fff;border-color:#4a5a80}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
nav button{border-radius:6px 6px 0 0;border-bottom:none;background:#e6ebf5}
nav button.on{background:#fff;font-weight:700;border-color:var(--orange);border-top:3px solid var(--orange)}
main{padding:0 16px 40px}
.panel{background:#fff;border:1px solid var(--line);padding:16px;border-radius:0 8px 8px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row .sp{flex:1}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:#fff;min-width:110px}
.chip b{font-size:22px;display:block}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}.w{background:var(--w)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:600;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fd}
.late{color:var(--r);font-weight:700}
.tbl{overflow-x:auto}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{min-width:230px;flex:1;background:#eef2f9;border-radius:8px;padding:8px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:2px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--w);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.card.green{border-left-color:var(--g)}.card.yellow{border-left-color:var(--y)}.card.red{border-left-color:var(--r)}.card.gray{border-left-color:var(--w)}
.card small{color:var(--mute);display:block}
.muted{color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:10}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:10px;max-width:760px;width:100%;padding:18px}
.sheet h2{font-size:18px;margin-bottom:10px}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--orange);border-bottom:2px solid var(--orange);margin:16px 0 8px;padding-bottom:3px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
input,select,textarea{font:inherit;width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li .t{flex:1;min-width:160px}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:20;max-width:90%}
.toast.err{background:var(--r)}
#auth{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
#auth h2{margin-bottom:12px}
#auth .f{margin-bottom:10px}
.hide{display:none!important}
.legend{font-size:12px;color:var(--mute);margin-top:10px}

.logo{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;flex:none}
.mark.big{width:64px;height:64px}
.gap{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#f2b84b;margin-top:1px;font-weight:600}
.gap.dark{color:var(--orange);margin-top:6px}
.authlogo{text-align:center;margin-bottom:14px;background:var(--navy);border-radius:8px;padding:14px 0 12px}
.authlogo .mark.big{display:block;margin:0 auto}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;text-align:center;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 4px 14px rgba(20,33,61,.18);transform:translateY(-2px)}
.tile h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin-bottom:4px}
.tile small{display:block;color:var(--orange);font-size:11px;margin-top:2px}
.tile svg,.big svg{max-width:100%;height:auto}
.big{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0}
.lg{min-width:190px}
.lg div{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lg div:hover,.lg div.on{background:#eef2f9}
.lg div.on{font-weight:700}
.sl{cursor:pointer;transition:transform .15s;transform-origin:center}
.sl:hover{opacity:.85}
.xbtn{float:right}
</style></head>

const fetchWithTimeout = (url, opts = {}) => {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);

const STATUS = {
  green:{label:"On track",cls:"g",rank:4},
  yellow:{label:"At risk",cls:"y",rank:2},
  red:{label:"Blocked",cls:"r",rank:1},

let tab = "week", stages = [], people = [], projects = [];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? d : "";

function must(res){ if(res.error){ const m=(res.error.name==="AbortError"?"No reply from the database after 20 seconds. Check your connection and try again.":res.error.message); toast(m, true); const e=new Error(m); e.shown=true; throw e; } return res.data; }

/* ---------- auth ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? enter(session) : leave();
  sb.auth.onAuthStateChange((_e, s) => s ? enter(s) : leave());
}
function leave(){ $("#auth").classList.remove("hide"); $("#app").classList.add("hide"); $("#signout").classList.add("hide"); $("#who").textContent=""; }
async function enter(session){
  $("#auth").classList.add("hide"); $("#app").classList.remove("hide"); $("#signout").classList.remove("hide");
  $("#who").textContent = session.user.email;
  await loadRef(); render();
}
$("#login").onclick = async () => {
  $("#authmsg").textContent = "";

  if(error) $("#authmsg").textContent = error.message;
};
$("#signup").onclick = async () => {
  $("#authmsg").textContent = "";
  const { data, error } = await sb.auth.signUp({ email:$("#em").value.trim(), password:$("#pw").value });
  if(error) $("#authmsg").textContent = error.message;
  else if(!data.session) $("#authmsg").textContent = "Account created. Check your email to confirm, then sign in.";
};
$("#signout").onclick = () => sb.auth.signOut();

/* ---------- data ---------- */
async function loadRef(){
  stages = must(await sb.from("project_stages").select("*").order("sort_order"));
  people = must(await sb.from("people").select("*").eq("is_active", true).order("full_name"));

}

}


/* ---------- analytics: donuts + Pareto ---------- */
const SC = { green:"#2e9e57", yellow:"#e0a21f", red:"#d6453d", gray:"#9aa3b5" };
const PALETTE = ["#14213d","#FB8102","#2f6fbf","#2e9e57","#e0a21f","#9aa3b5","#d6453d"];
function donutSVG(slices, size, center, sub, sel){
  const tot = slices.reduce((a,x)=>a+x.n,0), R=size/2, r=R*0.62, cx=R, cy=R;
  if(!tot) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#e6ebf5" stroke-width="${R-r}"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" fill="#5b6784">No data</text></svg>`;
  let a0=-Math.PI/2, out="";
  const live = slices.filter(x=>x.n>0);
  live.forEach(x=>{
    const frac=x.n/tot, a1=a0+frac*2*Math.PI, big=frac>0.5?1:0;
    const pt=(a,rad)=>[cx+rad*Math.cos(a), cy+rad*Math.sin(a)];
    let d;
    if(live.length===1){ d=`M${cx},${cy-R} A${R},${R} 0 1 1 ${cx-0.01},${cy-R} L${cx-0.01},${cy-r} A${r},${r} 0 1 0 ${cx},${cy-r} Z`; }
    else{ const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
      d=`M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z`; }
    const mid=(a0+a1)/2, dim = sel!=null && sel!==x.key ? .35 : 1;
    const shift = sel===x.key ? `transform="translate(${6*Math.cos(mid)},${6*Math.sin(mid)})"` : "";
    out+=`<path class="sl" data-key="${esc(x.key)}" d="${d}" fill="${x.color}" stroke="#fff" stroke-width="2" opacity="${dim}" ${shift}><title>${esc(x.label)}: ${x.n}</title></path>`;
    a0=a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}
    <text x="${cx}" y="${cy+size*0.04}" text-anchor="middle" font-size="${size*0.22}" font-weight="800" fill="#14213d">${center}</text>
    <text x="${cx}" y="${cy+size*0.14}" text-anchor="middle" font-size="${size*0.07}" fill="#5b6784">${esc(sub||"")}</text></svg>`;
}
function buildCharts(rows){
  const cnt=(f)=>rows.filter(f).length;
  const status=[["red","Blocked"],["yellow","At risk"],["green","On track"],["gray","Not started"]]
    .map(([k,l])=>({key:k,label:l,n:cnt(r=>r.status===k),color:SC[k],test:r=>r.status===k}));
  const stage=stages.filter(s=>s.code!=="closed").map((s,i)=>({key:s.code,label:s.name,n:cnt(r=>r.stage_code===s.code),color:PALETTE[i%PALETTE.length],test:r=>r.stage_code===s.code}));
  const sched=[{key:"late",label:"Late",n:cnt(r=>r.is_late),color:SC.red,test:r=>r.is_late},
    {key:"ok",label:"On schedule",n:cnt(r=>!r.is_late),color:SC.green,test:r=>!r.is_late}];
  return { status:{title:"Health (RYG)",slices:status,sub:"projects"},
           stage:{title:"Where the work sits",slices:stage,sub:"projects"},
           sched:{title:"Schedule",slices:sched,sub:"projects"} };
}
function paretoSVG(rows,w,h){
  const d=rows.filter(r=>(r.open_risks||0)>0).sort((a,b)=>b.open_risks-a.open_risks).slice(0,8);
  const tot=d.reduce((a,r)=>a+r.open_risks,0);
  if(!tot) return `<p class="muted" style="padding:20px 0">No open risks logged yet. Add risks inside a project and the Pareto fills in.</p>`;
  const L=34,B=46,T=14,Rm=34, pw=w-L-Rm, ph=h-T-B, bw=pw/d.length, max=d[0].open_risks;
  let cum=0, bars="", pts=[];
  d.forEach((r,i)=>{
    const bh=ph*r.open_risks/max, x=L+i*bw+bw*0.15, y=T+ph-bh; cum+=r.open_risks;
    bars+=`<rect x="${x}" y="${y}" width="${bw*0.7}" height="${bh}" fill="${SC[r.status]||SC.gray}" rx="3"><title>${esc(r.project_code)}: ${r.open_risks}</title></rect>
      <text x="${x+bw*0.35}" y="${y-3}" text-anchor="middle" font-size="11" font-weight="700" fill="#14213d">${r.open_risks}</text>
      <text x="${x+bw*0.35}" y="${h-B+14}" text-anchor="middle" font-size="10" fill="#5b6784">${esc(String(r.project_code).slice(0,10))}</text>`;
    pts.push([x+bw*0.35, T+ph-ph*cum/tot, Math.round(100*cum/tot)]);
  });
  const line=pts.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">
    <line x1="${L}" y1="${T+ph}" x2="${w-Rm}" y2="${T+ph}" stroke="#d8dfec"/>
    <line x1="${L}" y1="${T+ph*0.2}" x2="${w-Rm}" y2="${T+ph*0.2}" stroke="#d8dfec" stroke-dasharray="3 3"/>
    <text x="${w-Rm+4}" y="${T+ph*0.2+4}" font-size="10" fill="#FB8102">80%</text>
    ${bars}<path d="${line}" fill="none" stroke="#FB8102" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#FB8102"/><text x="${p[0]}" y="${p[1]-7}" text-anchor="middle" font-size="9" fill="#FB8102">${p[2]}%</text>`).join("")}
    <text x="${L-6}" y="${T+8}" text-anchor="end" font-size="10" fill="#5b6784">${max}</text></svg>
    <p class="legend">Bars: open risks per project (color = project health). Line: cumulative share. The few projects left of the 80% line hold most of the risk.</p>`;
}
function openChart(rows, which, sel){
  const c=buildCharts(rows)[which], tot=rows.length;
  const listRows = sel==null ? rows : rows.filter((c.slices.find(x=>x.key===sel)||{test:()=>true}).test);
  openModal(`<button class="xbtn" onclick="closeModal()">Close</button>
    <h2>${esc(c.title)}</h2>
    <div class="big"><div id="bigdonut">${donutSVG(c.slices,300,tot,c.sub,sel)}</div>
      <div class="lg">${c.slices.map(x=>`<div data-key="${esc(x.key)}" class="${sel===x.key?"on":""}"><span class="dot" style="background:${x.color}"></span>${esc(x.label)} <b style="margin-left:auto">${x.n}</b></div>`).join("")}
      <div data-key="" style="color:var(--mute)">${sel==null?"Showing all":"Show all"}</div></div></div>
    <h3>${sel==null?"All active projects":"Projects: "+esc((c.slices.find(x=>x.key===sel)||{}).label)} (${listRows.length})</h3>
    ${listRows.map(r=>`<div class="li" data-id="${r.project_id}" style="cursor:pointer"><span class="t">${pill(r.status)} <b>${esc(r.project_code)}</b> ${esc(r.name)}<small class="muted" style="display:block">${esc(stageName(r.stage_code))} · ${esc(r.owner_name)||"no owner"}${r.is_late?" · <span class='late'>LATE</span>":""}</small></span><span class="muted">${fmtDate(r.target_delivery_date)}</span></div>`).join("")||`<p class="muted">None.</p>`}`);
  document.querySelectorAll("#sheet [data-key]").forEach(el=>el.onclick=()=>{ const k=el.dataset.key||null; openChart(rows,which,k===sel?null:k); });
  document.querySelectorAll("#sheet .li[data-id]").forEach(el=>el.onclick=()=>detail(el.dataset.id));
}
function openPareto(rows){
  openModal(`<button class="xbtn" onclick="closeModal()">Close</button><h2>Where the risk is concentrated (Pareto)</h2>${paretoSVG(rows,640,300)}`);
}
function drawTiles(rows){
  const ch=buildCharts(rows);
  const tiles=Object.entries(ch).map(([k,c])=>`<div class="tile" data-chart="${k}"><h4>${esc(c.title)}</h4>${donutSVG(c.slices,150,rows.length,c.sub)}<small>Tap to expand</small></div>`).join("")
    + `<div class="tile" data-chart="pareto"><h4>Open risks (Pareto)</h4>${paretoSVG(rows,300,170).replace(/<p class="legend">.*<\/p>/s,"")}<small>Tap to expand</small></div>`;
  return `<div class="tiles">${tiles}</div>`;
}

async function renderWeek(){
  const rows = must(await sb.from("v_leadership_week").select("*"));
  rows.sort((a,b)=> (b.is_late - a.is_late) || ((STATUS[a.status]||{}).rank - (STATUS[b.status]||{}).rank) || String(a.target_delivery_date||"9999").localeCompare(String(b.target_delivery_date||"9999")));
  const count = k => rows.filter(r=>r.status===k).length;
  const late = rows.filter(r=>r.is_late).length;
  $("#panel").innerHTML = `
    <div class="row"><h2 style="font-size:18px">Leadership week</h2><span class="sp"></span>
      <button class="pri" id="newp">+ New project</button></div>
    <div class="sum">
      <div class="chip"><b>${rows.length}</b>Active projects</div>
      <div class="chip"><b class="late">${late}</b>Late</div>
      <div class="chip"><span class="dot r"></span><b style="display:inline">${count("red")}</b> Blocked</div>
      <div class="chip"><span class="dot y"></span><b style="display:inline">${count("yellow")}</b> At risk</div>
      <div class="chip"><span class="dot g"></span><b style="display:inline">${count("green")}</b> On track</div>
      <div class="chip"><span class="dot w"></span><b style="display:inline">${count("gray")}</b> Not started</div>
    </div>
    ${drawTiles(rows)}
    <div class="tbl"><table>
      <tr><th>Status</th><th>Project</th><th>Stage</th><th>Owner</th><th>Next milestone</th><th>Target</th><th>Risks</th><th>Decision needed</th></tr>
      ${rows.map(r=>`<tr class="click" data-id="${r.project_id}">
        <td>${pill(r.status)}</td>
        <td><b>${esc(r.project_code)}</b> ${esc(r.name)}<small class="muted" style="display:block">${esc(r.customer)}</small></td>
        <td>${esc(stageName(r.stage_code))}</td><td>${esc(r.owner_name)}</td>
        <td>${esc(r.next_milestone)}<small class="muted" style="display:block">${fmtDate(r.next_milestone_due)}</small></td>
        <td class="${r.is_late?"late":""}">${fmtDate(r.target_delivery_date)}${r.is_late?"<br>LATE":""}</td>
        <td>${r.open_risks||0}</td><td>${esc(r.decision_needed)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No active projects yet. Add the first one.</td></tr>`}
    </table></div>
    <p class="legend">Green on track · Yellow at risk · Red blocked · Gray not started. Late projects are listed first.</p>`;
  $("#newp").onclick = () => projectForm();
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => t.dataset.chart==="pareto" ? openPareto(rows) : openChart(rows, t.dataset.chart, null));
  document.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => detail(tr.dataset.id));
}

function renderBoard(){
  const open = stages.filter(s=>s.code!=="closed");
  $("#panel").innerHTML = `
    <div class="row"><h2 style="font-size:18px">Project board</h2><span class="sp"></span><button class="pri" id="newp">+ New project</button></div>
    <div class="board">${open.map(s=>{
      const ps = projects.filter(p=>p.stage_code===s.code);
      return `<div class="col"><h3>${esc(s.name)} (${ps.length})</h3>${ps.map(p=>`
        <div class="card ${p.status}" data-id="${p.id}"><b>${esc(p.project_code)}</b> ${esc(p.name)}
        <small>${pill(p.status)}</small><small>${esc(personName(p.owner_id))}${p.target_delivery_date?" · due "+p.target_delivery_date:""}</small></div>`).join("")}</div>`;
    }).join("")}</div>`;
  $("#newp").onclick = () => projectForm();
  document.querySelectorAll(".card").forEach(c => c.onclick = () => detail(c.dataset.id));
}

function renderPeople(){
  $("#panel").innerHTML = `
    <div class="row"><h2 style="font-size:18px">People</h2><span class="sp"></span></div>
    <div class="grid" style="margin-bottom:12px">
      <div><label>Name</label><input id="pn"></div><div><label>Email</label><input id="pe" type="email"></div>
      <div><label>Role</label><input id="pr"></div>
      <div style="align-self:end"><button class="pri" id="addp">Add person</button></div></div>
    <div class="tbl"><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
    ${people.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${esc(p.job_role)}</td>
      <td><button data-del="${p.id}">Deactivate</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">No people yet.</td></tr>`}</table></div>`;
  $("#addp").onclick = async () => {
    const full_name = $("#pn").value.trim(); if(!full_name) return toast("Name is required", true);
    try{
      must(await sb.from("people").insert({ full_name, email:$("#pe").value.trim()||null, job_role:$("#pr").value.trim()||null }));
      await loadRef(); renderPeople(); toast("Person added");
    }catch(e){ if(!e.shown) toast("Could not add person: "+(e&&e.message?e.message:e), true); }
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    must(await sb.from("people").update({ is_active:false }).eq("id", b.dataset.del));
    await loadRef(); renderPeople();
  });
}

/* ---------- modal ---------- */
function openModal(html){ $("#sheet").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").onclick = e => { if(e.target.id==="modal") closeModal(); };
const opts = (arr, val, key="id", lab="full_name", blank=true) =>
  (blank?`<option value="">—</option>`:"") + arr.map(a=>`<option value="${esc(a[key])}" ${a[key]===val?"selected":""}>${esc(a[lab])}</option>`).join("");

function projectForm(p){
  const x = p || { status:"gray", stage_code:"quote" };
  openModal(`<h2>${p?"Edit project":"New project"}</h2>
    <div class="grid">
      <div><label>Project code *</label><input id="f_code" value="${esc(x.project_code)}"></div>
      <div><label>Name *</label><input id="f_name" value="${esc(x.name)}"></div>
      <div><label>Customer</label><input id="f_cust" value="${esc(x.customer)}"></div>
      <div><label>Equipment type</label><input id="f_type" value="${esc(x.equipment_type)}"></div>
      <div><label>Contract value (USD)</label><input id="f_val" type="number" step="0.01" value="${esc(x.contract_value)}"></div>
      <div><label>Owner</label><select id="f_owner">${opts(people, x.owner_id)}</select></div>
      <div><label>Stage</label><select id="f_stage">${opts(stages, x.stage_code, "code", "name", false)}</select></div>
      <div><label>Status</label><select id="f_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===x.status?"selected":""}>${v.label}</option>`).join("")}</select></div>
      <div><label>Start date</label><input id="f_start" type="date" value="${esc(x.start_date)}"></div>
      <div><label>Target delivery</label><input id="f_target" type="date" value="${esc(x.target_delivery_date)}"></div>
      <div><label>Actual delivery</label><input id="f_actual" type="date" value="${esc(x.actual_delivery_date)}"></div>
    </div>
    <div style="margin-top:10px"><label>Notes</label><textarea id="f_notes" rows="3">${esc(x.notes)}</textarea></div>
    <div id="f_err" class="hide" style="margin-top:12px;padding:10px;border-radius:6px;background:#fdecea;color:#8a1f17;font-size:14px"></div>
    <div class="row" style="margin-top:14px"><button class="pri" id="f_save">Save</button><button id="f_cancel">Cancel</button>
      ${p?`<span class="sp"></span><button id="f_arch">Archive</button>`:""}</div>`);
  $("#f_cancel").onclick = closeModal;
  if(p) $("#f_arch").onclick = async () => {
    if(!confirm("Archive this project? It will be hidden from the board.")) return;
    must(await sb.from("projects").update({ is_archived:true }).eq("id", p.id));
    closeModal(); await loadRef(); render();
  };
  $("#f_save").onclick = async () => {
    const btn = $("#f_save"), box = $("#f_err"); box.classList.add("hide");
    const row = {
      project_code:$("#f_code").value.trim(), name:$("#f_name").value.trim(),
      customer:$("#f_cust").value.trim()||null, equipment_type:$("#f_type").value.trim()||null,
      contract_value:$("#f_val").value===""?null:Number($("#f_val").value),
      owner_id:$("#f_owner").value||null, stage_code:$("#f_stage").value, status:$("#f_status").value,
      start_date:$("#f_start").value||null, target_delivery_date:$("#f_target").value||null,
      actual_delivery_date:$("#f_actual").value||null, notes:$("#f_notes").value.trim()||null
    };
    const fail = m => { box.textContent = m; box.classList.remove("hide"); btn.disabled = false; btn.textContent = "Save"; };
    if(!row.project_code || !row.name) return fail("Project code and name are required.");
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      const q = p ? sb.from("projects").update(row).eq("id", p.id) : sb.from("projects").insert(row);
      const res = await Promise.race([q, new Promise(r => setTimeout(() => r({ error:{ message:"No reply from the database after 15 seconds. Check your internet connection and try again." } }), 15000))]);
      if(res.error) return fail("Could not save: " + res.error.message + (res.error.hint ? " (" + res.error.hint + ")" : ""));
      closeModal(); await loadRef(); render(); toast("Saved");
    }catch(e){ fail("Unexpected error: " + (e && e.message ? e.message : e)); }
  };
}

async function detail(id){
  try{ await detailInner(id); }catch(e){ console.error(e); if(!e.shown) toast("Could not open project: "+(e&&e.message?e.message:e), true); }
}
async function detailInner(id){
  const p = projects.find(x=>x.id===id) || must(await sb.from("projects").select("*").eq("id", id).single());
  const [ms, su, rk] = await Promise.all([
    sb.from("milestones").select("*").eq("project_id", id).order("sort_order").order("due_date"),
    sb.from("status_updates").select("*").eq("project_id", id).order("created_at", {ascending:false}),
    sb.from("risks").select("*").eq("project_id", id).order("created_at", {ascending:false})
  ]).then(r => r.map(must));
  const m = STATUS[p.status] || STATUS.gray;
  openModal(`
    <div class="row"><h2 style="margin:0">${esc(p.project_code)} · ${esc(p.name)}</h2><span class="sp"></span><button id="d_edit">Edit</button><button id="d_close">Close</button></div>
    <p>${pill(p.status)} · ${esc(stageName(p.stage_code))} · Owner: ${esc(personName(p.owner_id))||"—"}</p>
    <p class="muted">${esc(p.customer)}${p.equipment_type?" · "+esc(p.equipment_type):""}${p.target_delivery_date?" · Target "+p.target_delivery_date:""}</p>
    ${p.notes?`<p style="margin-top:6px">${esc(p.notes)}</p>`:""}

    <h3>Status update</h3>
    <div class="grid">
      <div><label>Status</label><select id="s_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===p.status?"selected":""}>${v.label}</option>`).join("")}</select></div>
      <div><label>Summary</label><input id="s_sum"></div>
      <div><label>Decision needed</label><input id="s_dec"></div>
      <div style="align-self:end"><button class="pri" id="s_add">Post update</button></div>
    </div>
    ${su.map(u=>`<div class="li"><span>${pill(u.status)}</span><span class="t">${esc(u.summary)}${u.decision_needed?`<br><b>Decision:</b> ${esc(u.decision_needed)}`:""}</span><span class="muted">${new Date(u.created_at).toLocaleDateString()}</span></div>`).join("")}

    <h3>Milestones</h3>
    <div class="grid"><div><label>Milestone</label><input id="m_name"></div><div><label>Due</label><input id="m_due" type="date"></div>
      <div><label>Owner</label><select id="m_owner">${opts(people, null)}</select></div>
      <div style="align-self:end"><button class="pri" id="m_add">Add</button></div></div>
    ${ms.map(x=>`<div class="li"><input type="checkbox" style="width:auto" data-ms="${x.id}" ${x.completed_date?"checked":""}>
      <span class="t" style="${x.completed_date?"text-decoration:line-through;color:#8a94ab":""}">${esc(x.name)}</span>
      <span class="muted">${esc(personName(x.owner_id))}</span><span class="${!x.completed_date&&x.due_date&&x.due_date<today()?"late":"muted"}">${fmtDate(x.due_date)}</span></div>`).join("")}

    <h3>Risks and issues</h3>
    <div class="grid"><div><label>Title</label><input id="r_title"></div>
      <div><label>Severity</label><select id="r_sev"><option>low</option><option selected>medium</option><option>high</option></select></div>
      <div><label>Owner</label><select id="r_owner">${opts(people, null)}</select></div>
      <div><label>Due</label><input id="r_due" type="date"></div>
      <div style="align-self:end"><button class="pri" id="r_add">Add</button></div></div>
    ${rk.map(x=>`<div class="li"><input type="checkbox" style="width:auto" data-rk="${x.id}" ${x.state==="closed"?"checked":""}>
      <span class="t" style="${x.state==="closed"?"text-decoration:line-through;color:#8a94ab":""}">${esc(x.title)}</span>
      <span class="muted">${esc(x.severity)} · ${esc(personName(x.owner_id))}</span><span class="muted">${fmtDate(x.due_date)}</span></div>`).join("")}
  `);
  const again = () => detail(id);
  $("#d_close").onclick = closeModal;
  $("#d_edit").onclick = () => projectForm(p);
  $("#s_add").onclick = async () => {
    must(await sb.from("status_updates").insert({ project_id:id, status:$("#s_status").value, summary:$("#s_sum").value.trim()||null, decision_needed:$("#s_dec").value.trim()||null }));
    await loadRef(); again(); toast("Update posted");
  };
  $("#m_add").onclick = async () => {
    const name = $("#m_name").value.trim(); if(!name) return toast("Milestone name required", true);
    must(await sb.from("milestones").insert({ project_id:id, name, due_date:$("#m_due").value||null, owner_id:$("#m_owner").value||null, sort_order:ms.length+1 }));
    again();
  };
  document.querySelectorAll("[data-ms]").forEach(c => c.onchange = async () => {
    must(await sb.from("milestones").update({ completed_date: c.checked ? today() : null }).eq("id", c.dataset.ms)); again();
  });
  $("#r_add").onclick = async () => {
    const title = $("#r_title").value.trim(); if(!title) return toast("Risk title required", true);
    must(await sb.from("risks").insert({ project_id:id, title, severity:$("#r_sev").value, owner_id:$("#r_owner").value||null, due_date:$("#r_due").value||null }));
    again();
  };
  document.querySelectorAll("[data-rk]").forEach(c => c.onchange = async () => {
    must(await sb.from("risks").update(c.checked ? { state:"closed", closed_at:new Date().toISOString() } : { state:"open", closed_at:null }).eq("id", c.dataset.rk)); again();
  });
}

boot();
</script>
</body></html>
